# ansible/ansible.cfg
[defaults]
# Inventories are generated per job by the worker; never fall back to a file.
inventory = /dev/null
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
display_skipped_hosts = False
interpreter_python = auto_silent
gathering = smart
timeout = 20
local_tmp = /data/tmp/ansible-local
remote_tmp = /tmp/.ansible-zbxdeploy
forks = 10
roles_path = /app/ansible/roles

[ssh_connection]
# accept-new records a host key the first time and refuses it if it ever
# changes - the useful middle ground between prompting and ignoring keys.
ssh_args = -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/data/ssh/known_hosts -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ConnectTimeout=15
pipelining = True

[persistent_connection]
command_timeout = 60
