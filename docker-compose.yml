# docker-compose.yml
services:
  db:
    image: mysql:8.4
    container_name: zbxdeploy-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-zbxdeploy}
      MYSQL_USER: ${DB_USER:-zbxdeploy}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [internal]

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: zbxdeploy:latest
    container_name: zbxdeploy-php
    restart: unless-stopped
    env_file: .env
    environment:
      ZBXDEPLOY_ROLE: web
    volumes:
      - .:/app
      - vendor_data:/app/vendor
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  web:
    image: nginx:1.27-alpine
    container_name: zbxdeploy-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/app:ro
    depends_on:
      - php
    networks: [internal]

  worker:
    image: zbxdeploy:latest
    container_name: zbxdeploy-worker
    restart: unless-stopped
    user: www-data
    command: ["php", "/app/bin/worker.php"]
    env_file: .env
    environment:
      ZBXDEPLOY_ROLE: worker
    volumes:
      - .:/app
      - vendor_data:/app/vendor
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy
      php:
        condition: service_started
    networks: [internal]

volumes:
  db_data:
  app_data:
  vendor_data:

networks:
  internal:
    driver: bridge
